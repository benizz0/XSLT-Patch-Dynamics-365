name: Release

# Manual: Actions > Release > Run workflow, on main, with the version (a.b.c.d).
# Sets the solution version, tests, builds the managed solutions (8.2, 9.1,
# 9.2), commits the version on main, tags it and publishes a GitHub release
# with the zips as assets.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version and tag, format a.b.c.d (e.g. 1.0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check version and tag
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be a.b.c.d, got '$VERSION'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Refuses a version lower than the one in solution.config.json.
      - name: Set version
        id: setver
        run: echo "result=$(node scripts/release.mjs set-version "$VERSION")" >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test

      - name: Build managed solutions
        run: node scripts/build.mjs --managed --target 8.2 --target 9.1 --target 9.2

      - name: Release notes
        run: |
          node scripts/release.mjs notes "$VERSION" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $VERSION: GitHub generates the notes."
          fi

      - name: Commit version and tag
        env:
          SETVER: ${{ steps.setver.outputs.result }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$SETVER" = "changed" ]; then
            git add solution/solution.config.json
            git commit -m "chore(release): $VERSION"
            git push origin HEAD:main
          fi
          git tag -a "$VERSION" -m "XSLT Patch $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$VERSION" dist/*_managed.zip \
            --title "XSLT Patch $VERSION" \
            --verify-tag \
            "${notes[@]}"
